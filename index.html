<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Titulo/descricao/OG padrao: usados ate o React montar, e por bots que nao
       executam JS (WhatsApp, Facebook, Twitter - o og:image/title/description
       deles SEMPRE vem desses valores estaticos, nunca dos dinamicos do React).
       O marcador data-default permite o <Seo> (src/components/Seo.jsx) remover
       essas tags assim que a versao especifica da pagina montar, pro Google
       (que executa JS) nao ver duas tags de description conflitantes. -->
  <title>Meraki Femme - Moda Feminina Premium</title>
  <meta data-default name="description" content="Meraki Femme - Lingerie e Moda Feminina Premium. Conheça nossas coleções exclusivas de conjuntos, camisolas, fantasias e acessórios." />

  <!-- Open Graph / WhatsApp / Facebook Link Preview -->
  <meta property="og:type" content="website" />
  <meta data-default property="og:title" content="Meraki Femme - Moda Feminina Premium" />
  <meta data-default property="og:description" content="Meraki Femme - Lingerie e Moda Feminina Premium. Conheça nossas coleções exclusivas de conjuntos, camisolas, fantasias e acessórios." />
  <meta data-default property="og:url" content="https://merakifemme.com.br/" />
  <meta property="og:image" content="https://merakifemme.com.br/og-image.png" />
  <meta property="og:image:secure_url" content="https://merakifemme.com.br/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Meraki Femme Logo" />
  <meta property="og:site_name" content="Meraki Femme" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter Card (campo fixo) -->
  <meta name="twitter:card" content="summary_large_image" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Meraki Femme",
    "url": "https://merakifemme.com.br",
    "logo": "https://merakifemme.com.br/favicon.png",
    "image": "https://merakifemme.com.br/og-image.png",
    "sameAs": [
      "https://www.instagram.com/merakistore"
    ]
  }
  </script>

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Manrope:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;550;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=block"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
